name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build portable exe
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --all-targets

      - name: Build release exe
        run: cargo build --release

      - name: Verify portable exe
        shell: pwsh
        run: |
          $exe = "target/release/steamidle.exe"
          if (-not (Test-Path $exe)) {
            throw "steamidle.exe was not produced"
          }
          $item = Get-Item $exe
          "steamidle.exe: $($item.Length) bytes"
          "sha256: $((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower())"
          $nonSystem = @()
          foreach ($name in @("VCRUNTIME140.dll", "MSVCP140.dll")) {
            $bytes = [System.IO.File]::ReadAllBytes($exe)
            if ([System.Text.Encoding]::ASCII.GetString($bytes).Contains($name)) {
              $nonSystem += $name
            }
          }
          if ($nonSystem.Count -gt 0) {
            throw "static CRT check failed: $($nonSystem -join ', ')"
          }
          "static CRT check: ok"

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: steamidle-windows-x64
          path: target/release/steamidle.exe
          if-no-files-found: error
          retention-days: 30
